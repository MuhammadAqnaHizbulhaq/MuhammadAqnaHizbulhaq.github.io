<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Pure Crisp White Background with Soft Rounded Corners -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="#ffffff"/>
  
  <!-- Subtle Ultra-Clean Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="none" stroke="#e5e5e7" stroke-width="12"/>

  <!-- Minimalist Executive Initials MA (Clean, Spacious, Deep Charcoal) -->
  <text x="256" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-size="140" font-weight="700" fill="#1d1d1f" text-anchor="middle" letter-spacing="4">MA</text>
  
  <!-- Subtle Azure Accent Dot -->
  <circle cx="256" cy="356" r="14" fill="#0066cc"/>
</svg>
